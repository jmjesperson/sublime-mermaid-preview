<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Nothing on this page may reach the network: scripts only from local files, images only inline. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src file: 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:">
<title>{{TITLE}}</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #toolbar { position: fixed; top: 10px; right: 10px; z-index: 1; display: flex; gap: 8px; align-items: center;
             padding: 4px 8px; background: rgba(255, 255, 255, 0.9); border: 1px solid #ddd; border-radius: 6px; }
  #toolbar button { font: inherit; padding: 2px 10px; cursor: pointer; }
  #zoom { min-width: 3.5em; text-align: right; color: #555; }
  #viewport { position: fixed; inset: 0; overflow: hidden; cursor: grab; touch-action: none; }
  #viewport.dragging { cursor: grabbing; }
  #stage { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  .error { color: #991b1b; margin: 16px; font-weight: 600; }
  pre { margin: 16px; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="toolbar"><button id="fit" type="button" title="Fit to screen (0)">Fit</button> <span id="zoom">100%</span></div>
<div id="viewport"><div id="stage"></div></div>
<script>window.MERMAID_PREVIEW = {source: {{SOURCE_JSON}}, config: {{CONFIG_JSON}}};</script>
<script src="mermaid.min.js"></script>
<script src="preview.js"></script>
</body>
</html>
